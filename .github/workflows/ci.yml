# Integración continua (docs/PLAN_DE_MEJORAS.md, Fase 9.5).
# Corre en cada push y pull request: calidad (Ruff + Mypy), tests (pytest,
# incluido el de integración contra un PostgreSQL real) y build de Docker.
#
# Requisito: este proyecto debe ser la RAÍZ de su propio repositorio de
# GitHub para que GitHub encuentre .github/workflows/.
name: CI

on:
  push:
  pull_request:

jobs:
  calidad:
    name: Ruff + Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy .

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    services:
      # Base VACÍA para tests/test_integracion_postgres.py (aplica todas las
      # migraciones de supabase/migrations/ y prueba los constraints).
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  docker:
    name: Build de la imagen
    runs-on: ubuntu-latest
    needs: [calidad, tests]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tecnielectronics:ci .
